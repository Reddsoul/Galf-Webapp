<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#EEF2EB">
<title>Galf</title>
<link rel="icon" type="image/x-icon" href="/galf.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<!-- No external libraries needed -->
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="app">
  <div id="content">
    <div id="v-home" class="view active"></div>
    <div id="v-rounds" class="view"></div>
    <div id="v-scorecard" class="view"></div>
    <div id="v-log-setup" class="view"></div>
    <div id="v-log-entry" class="view"></div>
    <div id="v-log-notes" class="view"></div>
    <div id="v-courses" class="view"></div>
    <div id="v-course-detail" class="view"></div>
    <div id="v-course-editor" class="view"></div>
    <div id="v-scan" class="view"></div>
    <div id="v-stats" class="view"></div>
    <div id="v-training-setup" class="view"></div>
    <div id="v-training" class="view"></div>
    <div id="v-training-history" class="view"></div>
    <div id="v-practice-detail" class="view"></div>
  </div>

  <!-- Tab bar: exactly 3 tabs matching _create_tab_bar -->
  <nav id="tabbar">
    <a class="tab" data-tab="rounds" onclick="navRounds()" aria-label="Logbook">
      <span class="tab-icon"><img src="/static/logbook-96.png" alt="Logbook"></span><span class="tab-label">Logbook</span></a>
    <a class="tab active" data-tab="home" onclick="navHome()" aria-label="Home">
      <span class="tab-icon"><img src="/static/golfer-96.png" alt="Home"></span><span class="tab-label"></span></a>
    <a class="tab" data-tab="courses" onclick="navCourses()" aria-label="Courses">
      <span class="tab-icon"><img src="/static/golf-course-96.png" alt="Courses"></span><span class="tab-label">Courses</span></a>
  </nav>
</div>

<script src="/static/app.js"></script>
</body>
</html>
